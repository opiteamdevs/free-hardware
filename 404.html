<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Rota Bloqueada | Adeus, Coleira Digital</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #ef4444;
            --accent-hover: #dc2626;
            --border-color: #1f2937;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }

        .error-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 5rem;
            color: var(--accent);
            margin-bottom: 10px;
            font-weight: 800;
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: var(--text-main);
        }

        p {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 1.05rem;
        }

        .btn {
            display: inline-block;
            background-color: var(--accent);
            color: white;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <div class="error-card">
        <h1>404</h1>
        <h2>Oops! Rota Bloqueada 🚫</h2>
        <p>Parece que essa página foi tragada por algum serviço de segundo plano ou bloqueada pelas Big Techs. Melhor voltar para a segurança do início!</p>
        <a href="/" class="btn">Retornar ao Manifesto 🚀</a>
    </div>

</body>
</html>
